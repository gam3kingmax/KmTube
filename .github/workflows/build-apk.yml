name: Build SnapGrab APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL of your SnapGrab server (e.g. http://192.168.1.10:8080)"
        required: true
        default: "http://192.168.1.10:8080"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SERVER_URL: ${{ inputs.server_url }}

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/snapgrab/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SnapGrab"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.snapgrab.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.snapgrab.app'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="SnapGrab"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/snapgrab/app/MainActivity.java <<'EOF'
          package com.snapgrab.app;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.URLUtil;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final String SERVER_URL = "__SERVER_URL__";
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) {
                              String html = "<h3>Cannot reach your server</h3>"
                                  + "<p>Tried: " + SERVER_URL + "</p>"
                                  + "<p>Make sure the server is running and your phone can reach it.</p>";
                              v.loadDataWithBaseURL(null, html, "text/html", "utf-8", null);
                          }
                      }
                  });

                  web.setDownloadListener((url, userAgent, contentDisposition, mimeType, length) -> {
                      String name = URLUtil.guessFileName(url, contentDisposition, mimeType);
                      DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                      req.setTitle(name);
                      req.setNotificationVisibility(
                          DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                      DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                      dm.enqueue(req);
                      Toast.makeText(this, "Downloading " + name, Toast.LENGTH_LONG).show();
                  });

                  web.loadUrl(SERVER_URL);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          sed -i "s|__SERVER_URL__|${SERVER_URL}|" app/src/main/java/com/snapgrab/app/MainActivity.java

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SnapGrab.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapGrab-apk
          path: SnapGrab.apk

      - name: Publish release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: SnapGrab v${{ github.run_number }}
          files: SnapGrab.apk
