name: Build SnapGrab APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/snapgrab/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SnapGrab"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.snapgrab.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.snapgrab.app'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="SnapGrab"
                  android:extractNativeLibs="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/snapgrab/app/MainActivity.java <<'EOF'
          package com.snapgrab.app;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import com.yausername.ffmpeg.FFmpeg;
          import com.yausername.youtubedl_android.YoutubeDL;
          import com.yausername.youtubedl_android.YoutubeDLRequest;
          import com.yausername.youtubedl_android.mapper.VideoFormat;
          import com.yausername.youtubedl_android.mapper.VideoInfo;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.List;
          import java.util.TreeSet;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {

              private static final int[] WANTED = {240, 360, 480, 720, 1080};

              private final ExecutorService bg = Executors.newSingleThreadExecutor();
              private volatile String initError = null;

              private EditText urlBox;
              private TextView status;
              private TextView infoView;
              private LinearLayout options;
              private Button searchBtn;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  buildUi();

                  bg.execute(() -> {
                      try {
                          YoutubeDL.getInstance().init(getApplication());
                          FFmpeg.getInstance().init(getApplication());
                      } catch (Exception e) {
                          initError = String.valueOf(e);
                      }
                  });

                  handleIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntent(intent);
              }

              private void handleIntent(Intent intent) {
                  if (intent != null && Intent.ACTION_SEND.equals(intent.getAction())) {
                      String text = intent.getStringExtra(Intent.EXTRA_TEXT);
                      if (text != null) {
                          urlBox.setText(extractUrl(text));
                          search();
                      }
                  }
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private void buildUi() {
                  ScrollView sv = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(32), dp(16), dp(16));
                  sv.addView(root);
                  setContentView(sv);

                  TextView title = new TextView(this);
                  title.setText("SnapGrab");
                  title.setTextSize(26);
                  root.addView(title);

                  urlBox = new EditText(this);
                  urlBox.setHint("Paste video link here");
                  urlBox.setSingleLine(true);
                  root.addView(urlBox, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);

                  Button pasteBtn = new Button(this);
                  pasteBtn.setText("Paste");
                  searchBtn = new Button(this);
                  searchBtn.setText("Search");

                  row.addView(pasteBtn, new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  row.addView(searchBtn, new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  root.addView(row);

                  status = new TextView(this);
                  status.setPadding(0, dp(12), 0, dp(12));
                  root.addView(status);

                  infoView = new TextView(this);
                  infoView.setTextSize(16);
                  root.addView(infoView);

                  options = new LinearLayout(this);
                  options.setOrientation(LinearLayout.VERTICAL);
                  root.addView(options);

                  pasteBtn.setOnClickListener(v -> {
                      ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                      ClipData d = cm.getPrimaryClip();
                      if (d != null && d.getItemCount() > 0) {
                          CharSequence t = d.getItemAt(0).coerceToText(this);
                          urlBox.setText(extractUrl(String.valueOf(t)));
                          search();
                      } else {
                          status.setText("Clipboard is empty. Copy a video link first.");
                      }
                  });

                  searchBtn.setOnClickListener(v -> search());
              }

              private String extractUrl(String s) {
                  Matcher m = Pattern.compile("https?://\\S+").matcher(s);
                  return m.find() ? m.group() : s.trim();
              }

              private String nz(String s) {
                  return s == null ? "" : s;
              }

              private String fmtTime(long sec) {
                  if (sec <= 0) return "";
                  long m = sec / 60;
                  long r = sec % 60;
                  return m + ":" + (r < 10 ? "0" : "") + r;
              }

              private void setBusy(boolean busy) {
                  runOnUiThread(() -> {
                      searchBtn.setEnabled(!busy);
                      for (int i = 0; i < options.getChildCount(); i++) {
                          options.getChildAt(i).setEnabled(!busy);
                      }
                  });
              }

              private void search() {
                  final String url = extractUrl(urlBox.getText().toString());
                  if (!url.startsWith("http")) {
                      status.setText("Paste a valid link first.");
                      return;
                  }
                  options.removeAllViews();
                  infoView.setText("");
                  status.setText("Searching for downloadable files...");
                  setBusy(true);

                  bg.execute(() -> {
                      if (initError != null) {
                          runOnUiThread(() -> status.setText("Engine failed to start: " + initError));
                          setBusy(false);
                          return;
                      }
                      try {
                          VideoInfo info = YoutubeDL.getInstance().getInfo(url);
                          TreeSet<Integer> heights = new TreeSet<>();
                          List<VideoFormat> fs = info.getFormats();
                          if (fs != null) {
                              for (VideoFormat f : fs) {
                                  try {
                                      String vc = f.getVcodec();
                                      int hh = f.getHeight();
                                      if (hh > 0 && vc != null && !vc.equals("none")) {
                                          heights.add(hh);
                                      }
                                  } catch (Exception ignored) {
                                  }
                              }
                          }
                          final String line = nz(info.getTitle()) + "\n"
                                  + nz(info.getUploader()) + " " + fmtTime(info.getDuration());

                          runOnUiThread(() -> {
                              status.setText("Choose what to download:");
                              infoView.setText(line);
                              for (int h : WANTED) {
                                  if (heights.contains(h)) {
                                      addOption(h + "p video (MP4)", url, false, h);
                                  }
                              }
                              addOption("Best quality video (MP4)", url, false, -1);
                              addOption("Audio only (MP3)", url, true, -1);
                          });
                      } catch (Exception e)
