name: Build SnapGrab APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/snapgrab/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SnapGrab"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.snapgrab.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.snapgrab.app'
                  minSdk 29
                  targetSdk 34
                  versionCode 3
                  versionName '2.1'
                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#4F46E5</color>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:scaleX="1.1"
                  android:scaleY="1.1"
                  android:pivotX="54"
                  android:pivotY="54">
                  <path
                      android:pathData="M30,36 L30,72 M44,38 L32,55 M33,53 L45,72"
                      android:fillColor="#00000000"
                      android:strokeColor="#FFFFFF"
                      android:strokeWidth="6"
                      android:strokeLineCap="round"
                      android:strokeLineJoin="round" />
                  <path
                      android:pathData="M52,72 L52,58 Q52,51 58,51 Q64,51 64,58 L64,72 M64,58 Q64,51 70,51 Q76,51 76,58 L76,72"
                      android:fillColor="#00000000"
                      android:strokeColor="#FFFFFF"
                      android:strokeWidth="6"
                      android:strokeLineCap="round"
                      android:strokeLineJoin="round" />
              </group>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="SnapGrab"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:extractNativeLibs="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/snapgrab/app/MainActivity.java <<'EOF'
          package com.snapgrab.app;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.DocumentsContract;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import com.yausername.ffmpeg.FFmpeg;
          import com.yausername.youtubedl_android.YoutubeDL;
          import com.yausername.youtubedl_android.YoutubeDLRequest;
          import com.yausername.youtubedl_android.mapper.VideoFormat;
          import com.yausername.youtubedl_android.mapper.VideoInfo;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.lang.reflect.Array;
          import java.lang.reflect.InvocationHandler;
          import java.lang.reflect.InvocationTargetException;
          import java.lang.reflect.Method;
          import java.lang.reflect.Proxy;
          import java.util.List;
          import java.util.TreeSet;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {

              private static final int[] WANTED = {240, 360, 480, 720, 1080};
              private static final int REQ_TREE = 1001;
              private static final String UPDATING = "Updating download engine...";

              private static final int MATCH = ViewGroup.LayoutParams.MATCH_PARENT;
              private static final int WRAP = ViewGroup.LayoutParams.WRAP_CONTENT;

              private static final int BG = 0xFFF3F5FA;
              private static final int CARD = 0xFFFFFFFF;
              private static final int ACCENT = 0xFF4F46E5;
              private static final int TEXT = 0xFF1F2430;
              private static final int MUTED = 0xFF6B7280;
              private static final int FIELD = 0xFFF0F2F8;
              private static final int GREEN = 0xFF15803D;
              private static final int RED = 0xFFB91C1C;

              private final ExecutorService bg = Executors.newSingleThreadExecutor();
              private volatile String initError = null;
              private SharedPreferences prefs;

              private EditText urlBox;
              private TextView status;
              private TextView destPath;
              private Button pasteBtn;
              private Button searchBtn;
              private Button changeBtn;
              private Button resetBtn;
              private Button updateBtn;
              private LinearLayout resultCard;
              private TextView titleView;
              private TextView metaView;
              private LinearLayout options;
              private LinearLayout progressBox;
              private ProgressBar progressBar;
              private TextView percentText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("km", MODE_PRIVATE);

                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);

                  buildUi();
                  updateDest();

                  bg.execute(() -> {
                      try {
                          YoutubeDL.getInstance().init(getApplication());
                          FFmpeg.getInstance().init(getApplication());
                      } catch (Exception e) {
                          initError = String.valueOf(e);
                          return;
                      }
                      long last = prefs.getLong("lastUpdate", 0L);
                      if (System.currentTimeMillis() - last > 24L * 60 * 60 * 1000) {
                          doUpdate(false);
                      }
                  });

                  handleIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntent(intent);
              }

              private void handleIntent(Intent intent) {
                  if (intent != null && Intent.ACTION_SEND.equals(intent.getAction())) {
                      String text = intent.getStringExtra(Intent.EXTRA_TEXT);
                      if (text != null) {
                          urlBox.setText(extractUrl(text));
                          search();
                      }
                  }
              }

              // ---------- UI helpers ----------

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private GradientDrawable shape(int fill, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(fill);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              private GradientDrawable outline(int fill, int stroke, int radiusDp) {
                  GradientDrawable g = shape(fill, radiusDp);
                  g.setStroke(dp(1), stroke);
                  return g;
              }

              private LinearLayout.LayoutParams lp(int w, int h, int topDp) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(w, h);
                  p.topMargin = dp(topDp);
                  return p;
              }

              private TextView label(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              private Button makeButton(String text, boolean filled) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextSize(15);
                  b.setStateListAnimator(null);
                  b.setTextColor(filled ? Color.WHITE : ACCENT);
                  b.setBackground(filled ? shape(ACCENT, 12) : outline(CARD, ACCENT, 12));
                  b.setPadding(dp(16), dp(10), dp(16), dp(10));
                  b.setMinimumHeight(dp(48));
                  return b;
              }

              private LinearLayout newCard(LinearLayout parent) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(16), dp(16), dp(16), dp(16));
                  c.setBackground(shape(CARD, 16));
                  c.setElevation(dp(2));
                  parent.addView(c, lp(MATCH, WRAP, 12));
                  return c;
              }

              private void buildUi() {
                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(BG);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(24), dp(16), dp(24));
                  sv.addView(root);
                  setContentView(sv);

                  // Header
                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  TextView logo = label("Km", 20, Color.WHITE, true);
                  logo.setGravity(Gravity.CENTER);
                  logo.setBackground(shape(ACCENT, 14));
                  header.addView(logo, new LinearLayout.LayoutParams(dp(48), dp(48)));
                  LinearLayout names = new LinearLayout(this);
                  names.setOrientation(LinearLayout.VERTICAL);
                  names.setPadding(dp(12), 0, 0, 0);
                  names.addView(label("SnapGrab", 22, TEXT, true));
                  names.addView(label("Video and audio downloader", 13, MUTED, false));
                  header.addView(names);
                  root.addView(header);

                  // Link card
                  LinearLayout linkCard = newCard(root);
                  linkCard.addView(label("Video link", 13, MUTED, false));
                  urlBox = new EditText(this);
                  urlBox.setHint("Paste video link here");
                  urlBox.setHintTextColor(MUTED);
                  urlBox.setTextColor(TEXT);
                  urlBox.setTextSize(15);
                  urlBox.setSingleLine(true);
                  urlBox.setBackground(shape(FIELD, 12));
                  urlBox.setPadding(dp(14), dp(12), dp(14), dp(12));
                  linkCard.addView(urlBox, lp(MATCH, WRAP, 8));

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  pasteBtn = makeButton("Paste", false);
                  searchBtn = makeButton("Search", true);
                  LinearLayout.LayoutParams a = new LinearLayout.LayoutParams(0, WRAP, 1f);
                  a.rightMargin = dp(8);
                  LinearLayout.LayoutParams b = new LinearLayout.LayoutParams(0, WRAP, 1f);
                  row.addView(pasteBtn, a);
                  row.addView(searchBtn, b);
                  linkCard.addView(row, lp(MATCH, WRAP, 12));

                  // Destination card
                  LinearLayout destCard = newCard(root);
                  destCard.addView(label("Save to", 13, MUTED, false));
                  destPath = label("", 15, TEXT, true);
                  destCard.addView(destPath, lp(MATCH, WRAP, 2));
                  LinearLayout drow = new LinearLayout(this);
                  drow.setOrientation(LinearLayout.HORIZONTAL);
                  changeBtn = makeButton("Change folder", false);
                  resetBtn = makeButton("Use default", false);
                  LinearLayout.LayoutParams c1 = new LinearLayout.LayoutParams(0, WRAP, 1f);
                  c1.rightMargin = dp(8);
                  drow.addView(changeBtn, c1);
                  drow.addView(resetBtn, new LinearLayout.LayoutParams(0, WRAP, 1f));
                  destCard.addView(drow, lp(MATCH, WRAP, 12));

                  // Status
                  status = label("", 14, MUTED, false);
                  status.setPadding(dp(4), dp(12), dp(4), 0);
                  status.setVisibility(View.GONE);
                  root.addView(status);

                  // Result card
                  resultCard = newCard(root);
                  resultCard.setVisibility(View.GONE);
                  titleView = label("", 17, TEXT, true);
                  metaView = label("", 13, MUTED, false);
                  resultCard.addView(titleView);
                  resultCard.addView(metaView, lp(MATCH, WRAP, 2));
                  TextView choose = label("Choose what to download", 13, MUTED, false);
                  resultCard.addView(choose, lp(MATCH, WRAP, 14));
                  options = new LinearLayout(this);
                  options.setOrientation(LinearLayout.VERTICAL);
                  resultCard.addView(options);

                  progressBox = new LinearLayout(this);
                  progressBox.setOrientation(LinearLayout.VERTICAL);
                  progressBox.setVisibility(View.GONE);
                  percentText = label("", 15, TEXT, true);
                  progressBox.addView(percentText);
                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setMax(100);
                  progressBar.setProgressTintList(ColorStateList.valueOf(ACCENT));
                  progressBar.setProgressBackgroundTintList(ColorStateList.valueOf(0xFFE5E7EB));
                  progressBar.setIndeterminateTintList(ColorStateList.valueOf(ACCENT));
                  progressBox.addView(progressBar, lp(MATCH, dp(10), 8));
                  resultCard.addView(progressBox, lp(MATCH, WRAP, 16));

                  // Update button
                  updateBtn = makeButton("Update download engine", false);
                  root.addView(updateBtn, lp(MATCH, WRAP, 16));

                  // Actions
                  pasteBtn.setOnClickListener(v -> {
                      ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                      ClipData d = cm.getPrimaryClip();
                      if (d != null && d.getItemCount() > 0) {
                          CharSequence t = d.getItemAt(0).coerceToText(this);
                          urlBox.setText(extractUrl(String.valueOf(t)));
                          search();
                      } else {
                          setStatus("Clipboard is empty. Copy a video link first.", true);
                      }
                  });
                  searchBtn.setOnClickListener(v -> search());
                  changeBtn.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION
                              | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                              | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                      startActivityForResult(i, REQ_TREE);
                  });
                  resetBtn.setOnClickListener(v -> {
                      prefs.edit().remove("tree").apply();
                      updateDest();
                  });
                  updateBtn.setOnClickListener(v -> {
                      setBusy(true);
                      bg.execute(() -> {
                          doUpdate(true);
                          setBusy(false);
                      });
                  });
              }

              private void setStatus(String msg, boolean error) {
                  status.setText(msg);
                  status.setTextColor(error ? RED : MUTED);
                  status.setVisibility(msg.isEmpty() ? View.GONE : View.VISIBLE);
              }

              private void setStatusOk(String msg) {
                  status.setText(msg);
                  status.setTextColor(GREEN);
                  status.setVisibility(View.VISIBLE);
              }

              // ---------- Engine update ----------

              private Object pickChannel(Class<?> c) {
                  try {
                      Object o = c.getField("_STABLE").get(null);
                      if (o != null) return o;
                  } catch (Throwable ignored) {
                  }
                  try {
                      Object o = c.getField("STABLE").get(null);
                      if (o != null) return o;
                  } catch (Throwable ignored) {
                  }
                  try {
                      return Class.forName(c.getName() + "$STABLE").getField("INSTANCE").get(null);
                  } catch (Throwable ignored) {
                  }
                  try {
                      Object[] cs = c.getEnumConstants();
                      if (cs != null) {
                          for (Object o : cs) {
                              if (o.toString().equals("STABLE")) return o;
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  return null;
              }

              private String updateEngine() throws Exception {
                  Exception lastErr = null;
                  for (Method m : YoutubeDL.class.getMethods()) {
                      if (!m.getName().equals("updateYoutubeDL")) continue;
                      Class<?>[] pt = m.getParameterTypes();
                      Object[] args = new Object[pt.length];
                      for (int i = 0; i < pt.length; i++) {
                          if (pt[i].isAssignableFrom(getApplication().getClass())) {
                              args[i] = getApplication();
                          } else {
                              args[i] = pickChannel(pt[i]);
                          }
                      }
                      try {
                          Object r = m.invoke(YoutubeDL.getInstance(), args);
                          return String.valueOf(r);
                      } catch (InvocationTargetException e) {
                          Throwable c = e.getCause();
                          lastErr = (c instanceof Exception) ? (Exception) c : e;
                      } catch (Exception e) {
                          lastErr = e;
                      }
                  }
                  if (lastErr != null) throw lastErr;
                  throw new RuntimeException("This engine version cannot be updated inside the app.");
              }

              private void doUpdate(boolean manual) {
                  runOnUiThread(() -> setStatus(UPDATING, false));
                  try {
                      String r = updateEngine();
                      prefs.edit().putLong("lastUpdate", System.currentTimeMillis()).apply();
                      final String msg = r.toUpperCase().contains("ALREADY")
                              ? "Download engine is already up to date."
                              : "Download engine updated. Try your link again.";
                      runOnUiThread(() -> {
                          if (manual) {
                              setStatusOk(msg);
                          } else if (status.getText().toString().equals(UPDATING)) {
                              setStatus("", false);
                          }
                      });
                  } catch (Exception e) {
                      final String m = cleanError(String.valueOf(e.getMessage()));
                      runOnUiThread(() -> {
                          if (manual) {
                              setStatus("Update failed: " + m, true);
                          } else if (status.getText().toString().equals(UPDATING)) {
                              setStatus("", false);
                          }
                      });
                  }
              }

              private String cleanError(String raw) {
                  if (raw == null) return "Unknown error";
                  StringBuilder kept = new StringBuilder();
                  for (String line : raw.split("\n")) {
                      String t = line.trim();
                      if (t.isEmpty()) continue;
                      if (t.startsWith("WARNING: Your yt-dlp version")) continue;
                      if (t.startsWith("It is strongly recommended")) continue;
                      if (t.startsWith("Run \"yt-dlp")) continue;
                      if (t.startsWith("To suppress this warning")) continue;
                      kept.append(t.replace("ERROR: ", "").replace("WARNING: ", "")).append(' ');
                  }
                  String out = kept.length() > 0 ? kept.toString().trim() : raw.trim();
                  if (out.length() > 350) out = out.substring(0, 350) + "...";
                  String low = raw.toLowerCase();
                  if (low.contains("login") || low.contains("cookies")
                          || low.contains("empty media response") || low.contains("rate-limit")) {
                      out += "\n\nThis link seems to need a logged-in session. Public posts usually work "
                              + "after updating the engine. Private or login-only posts need cookies, "
                              + "which this app does not support yet.";
                  }
                  return out;
              }

              // ---------- Destination folder ----------

              private String destLabel() {
                  String tree = prefs.getString("tree", null);
                  if (tree == null) return "Downloads/SnapGrab (default)";
                  try {
                      String id = DocumentsContract.getTreeDocumentId(Uri.parse(tree));
                      if (id.startsWith("primary:")) {
                          return "Internal storage/" + id.substring(8);
                      }
                      return id.replace(":", "/");
                  } catch (Exception e) {
                      return "Custom folder";
                  }
              }

              private void updateDest() {
                  destPath.setText(destLabel());
                  resetBtn.setVisibility(prefs.getString("tree", null) == null ? View.GONE : View.VISIBLE);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_TREE && resultCode == RESULT_OK
                          && data != null && data.getData() != null) {
                      Uri u = data.getData();
                      try {
                          getContentResolver().takePersistableUriPermission(u,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                                          | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      } catch (Exception ignored) {
                      }
                      prefs.edit().putString("tree", u.toString()).apply();
                      updateDest();
                  }
              }

              // ---------- Helpers ----------

              private String extractUrl(String s) {
                  Matcher m = Pattern.compile("https?://\\S+").matcher(s);
                  return m.find() ? m.group() : s.trim();
              }

              private String nz(String s) {
                  return s == null ? "" : s;
              }

              private String fmtTime(long sec) {
                  if (sec <= 0) return "";
                  long m = sec / 60;
                  long r = sec % 60;
                  return m + ":" + (r < 10 ? "0" : "") + r;
              }

              private void setBusy(boolean busy) {
                  runOnUiThread(() -> {
                      float alpha = busy ? 0.5f : 1f;
                      Button[] all = {searchBtn, pasteBtn, changeBtn, resetBtn, updateBtn};
                      for (Button x : all) {
                          x.setEnabled(!busy);
                          x.setAlpha(alpha);
                      }
                      for (int i = 0; i < options.getChildCount(); i++) {
                          options.getChildAt(i).setEnabled(!busy);
                          options.getChildAt(i).setAlpha(alpha);
                      }
                  });
              }

              private void showProgress(int pct, String text) {
                  runOnUiThread(() -> {
                      progressBox.setVisibility(View.VISIBLE);
                      progressBar.setIndeterminate(false);
                      progressBar.setProgress(pct);
                      percentText.setText(text);
                  });
              }

              private void showWorking(String text) {
                  runOnUiThread(() -> {
                      progressBox.setVisibility(View.VISIBLE);
                      progressBar.setIndeterminate(true);
                      percentText.setText(text);
                  });
              }

              // ---------- Search ----------

              private void search() {
                  final String url = extractUrl(urlBox.getText().toString());
                  if (!url.startsWith("http")) {
                      setStatus("Paste a valid link first.", true);
                      return;
                  }
                  options.removeAllViews();
                  resultCard.setVisibility(View.GONE);
                  progressBox.setVisibility(View.GONE);
                  setStatus("Searching for downloadable files...", false);
                  setBusy(true);

                  bg.execute(() -> {
                      if (initError != null) {
                          runOnUiThread(() -> setStatus("Engine failed to start: " + initError, true));
                          setBusy(false);
                          return;
                      }
                      try {
                          VideoInfo info = YoutubeDL.getInstance().getInfo(url);
                          TreeSet<Integer> heights = new TreeSet<>();
                          List<VideoFormat> fs = info.getFormats();
                          if (fs != null) {
                              for (VideoFormat f : fs) {
                                  try {
                                      String vc = f.getVcodec();
                                      int hh = f.getHeight();
                                      if (hh > 0 && vc != null && !vc.equals("none")) {
                                          heights.add(hh);
                                      }
                                  } catch (Exception ignored) {
                                  }
                              }
                          }
                          final String vTitle = nz(info.getTitle());
                          final String vMeta = (nz(info.getUploader()) + "  " + fmtTime(info.getDuration())).trim();

                          runOnUiThread(() -> {
                              setStatus("", false);
                              titleView.setText(vTitle);
                              metaView.setText(vMeta);
                              for (int h : WANTED) {
                                  if (heights.contains(h)) {
                                      addOption(h + "p video (MP4)", url, false, h, true);
                                  }
                              }
                              addOption("Best quality video (MP4)", url, false, -1, true);
                              addOption("Audio only (MP3)", url, true, -1, false);
                              resultCard.setVisibility(View.VISIBLE);
                          });
                      } catch (Exception e) {
                          final String msg = cleanError(String.valueOf(e.getMessage()));
                          runOnUiThread(() -> setStatus("Could not read this link: " + msg, true));
                      }
                      setBusy(false);
                  });
              }

              private void addOption(String text, String url, boolean audio, int height, boolean filled) {
                  Button b = makeButton(text, filled);
                  b.setOnClickListener(v -> download(url, audio, height));
                  options.addView(b, lp(MATCH, WRAP, 8));
              }

              // ---------- Download ----------

              private void runWithProgress(YoutubeDLRequest req, InvocationHandler handler) throws Exception {
                  YoutubeDL yt = YoutubeDL.getInstance();
                  for (Method m : YoutubeDL.class.getMethods()) {
                      if (!m.getName().equals("execute")) continue;
                      Class<?>[] pt = m.getParameterTypes();
                      if (pt.length < 2 || pt[0] != YoutubeDLRequest.class) continue;
                      int cb = -1;
                      for (int i = 1; i < pt.length; i++) {
                          if (pt[i].isInterface()) {
                              cb = i;
                              break;
                          }
                      }
                      if (cb < 0) continue;

                      Object[] args = new Object[pt.length];
                      args[0] = req;
                      for (int i = 1; i < pt.length; i++) {
                          if (i == cb) {
                              args[i] = Proxy.newProxyInstance(
                                      pt[cb].getClassLoader(), new Class<?>[]{pt[cb]}, handler);
                          } else if (pt[i].isPrimitive()) {
                              args[i] = Array.get(Array.newInstance(pt[i], 1), 0);
                          } else {
                              args[i] = null;
                          }
                      }
                      try {
                          m.invoke(yt, args);
                          return;
                      } catch (InvocationTargetException e) {
                          Throwable c = e.getCause();
                          if (c instanceof Exception) throw (Exception) c;
                          throw e;
                      }
                  }
                  yt.execute(req);
              }

              private void download(String url, boolean audio, int height) {
                  setBusy(true);
                  setStatus("", false);
                  showProgress(0, "Starting... 0%");

                  bg.execute(() -> {
                      File dir = new File(getExternalFilesDir(null), "dl" + System.currentTimeMillis());
                      try {
                          dir.mkdirs();
                          YoutubeDLRequest req = new YoutubeDLRequest(url);
                          req.addOption("--no-playlist");
                          req.addOption("--restrict-filenames");
                          req.addOption("--newline");
                          req.addOption("-o", dir.getAbsolutePath() + "/%(title).60s.%(ext)s");

                          if (audio) {
                              req.addOption("-f", "ba/b");
                              req.addOption("-x");
                              req.addOption("--audio-format", "mp3");
                          } else {
                              String f;
                              if (height > 0) {
                                  f = "bv*[height<=" + height + "][ext=mp4]+ba[ext=m4a]"
                                          + "/bv*[height<=" + height + "]+ba"
                                          + "/b[height<=" + height + "]/b";
                              } else {
                                  f = "bv*[ext=mp4]+ba[ext=m4a]/bv*+ba/b";
                              }
                              req.addOption("-f", f);
                              req.addOption("--merge-output-format", "mp4");
                          }

                          final int[] stage = {1};
                          final float[] last = {0f};
                          InvocationHandler handler = (proxyObj, method, args) -> {
                              if (method.getDeclaringClass() == Object.class) {
                                  switch (method.getName()) {
                                      case "equals":
                                          return proxyObj == args[0];
                                      case "hashCode":
                                          return System.identityHashCode(proxyObj);
                                      default:
                                          return "ProgressListener";
                                  }
                              }
                              if (args != null && args.length > 0 && args[0] instanceof Number) {
                                  float p = ((Number) args[0]).floatValue();
                                  if (p < last[0] - 30f) stage[0]++;
                                  last[0] = p;
                                  int pct = Math.max(0, Math.min(100, Math.round(p)));
                                  String part = stage[0] > 1 ? " (part " + stage[0] + ")" : "";
                                  showProgress(pct, "Downloading" + part + "  " + pct + "%");
                              }
                              return null;
                          };

                          runWithProgress(req, handler);

                          showWorking("Processing and saving...");
                          File out = pickOutput(dir);
                          if (out == null) {
                              throw new RuntimeException("No file was produced");
                          }
                          final String where = saveFile(out);
                          final String name = out.getName();
                          showProgress(100, "Done  100%");
                          runOnUiThread(() -> setStatusOk("Saved to " + where + "\n" + name));
                      } catch (Exception e) {
                          final String msg = cleanError(String.valueOf(e.getMessage()));
                          runOnUiThread(() -> {
                              progressBox.setVisibility(View.GONE);
                              setStatus("Download failed: " + msg, true);
                          });
                      } finally {
                          deleteRecursive(dir);
                          setBusy(false);
                      }
                  });
              }

              private File pickOutput(File dir) {
                  File[] files = dir.listFiles();
                  if (files == null) return null;
                  File best = null;
                  for (File f : files) {
                      String n = f.getName();
                      if (n.endsWith(".part") || n.endsWith(".ytdl")) continue;
                      if (best == null || f.length() > best.length()) best = f;
                  }
                  return best;
              }

              private String mimeFor(String name) {
                  String n = name.toLowerCase();
                  if (n.endsWith(".mp4")) return "video/mp4";
                  if (n.endsWith(".mp3")) return "audio/mpeg";
                  if (n.endsWith(".m4a")) return "audio/mp4";
                  if (n.endsWith(".webm")) return "video/webm";
                  if (n.endsWith(".mkv")) return "video/x-matroska";
                  return "application/octet-stream";
              }

              private String saveFile(File src) throws Exception {
                  String tree = prefs.getString("tree", null);
                  Uri target;
                  if (tree != null) {
                      Uri treeUri = Uri.parse(tree);
                      Uri parent = DocumentsContract.buildDocumentUriUsingTree(
                              treeUri, DocumentsContract.getTreeDocumentId(treeUri));
                      target = DocumentsContract.createDocument(
                              getContentResolver(), parent, mimeFor(src.getName()), src.getName());
                      if (target == null) {
                          throw new RuntimeException(
                                  "Cannot write to the chosen folder. Pick another folder.");
                      }
                  } else {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.Downloads.DISPLAY_NAME, src.getName());
                      values.put(MediaStore.Downloads.MIME_TYPE, mimeFor(src.getName()));
                      values.put(MediaStore.Downloads.RELATIVE_PATH, "Download/SnapGrab");
                      target = getContentResolver().insert(
                              MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (target == null) {
                          throw new RuntimeException("Could not create file in Downloads");
                      }
                  }
                  try (InputStream in = new FileInputStream(src);
                       OutputStream out = getContentResolver().openOutputStream(target)) {
                      byte[] buf = new byte[64 * 1024];
                      int n;
                      while ((n = in.read(buf)) > 0) {
                          out.write(buf, 0, n);
                      }
                  }
                  return destLabel();
              }

              private void deleteRecursive(File f) {
                  File[] kids = f.listFiles();
                  if (kids != null) {
                      for (File k : kids) deleteRecursive(k);
                  }
                  f.delete();
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SnapGrab.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapGrab-apk
          path: SnapGrab.apk

      - name: Publish release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: SnapGrab v${{ github.run_number }}
          files: SnapGrab.apk
